<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WPC Aufnahme</title>
<meta name="apple-mobile-web-app-title" content="WPC Aufnahme">
<meta name="theme-color" content="#96181c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: Arbeitsfläche fürs iPad – Kopfleiste + Registerkarten, darunter Formularzeilen wie das Papierformular (Nr · Bezeichnung · Eingaben) */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --surface2:#efedea; --line:#dcd8d2; --fg:#1d1b19; --muted:#6c6660;
  --brand:#96181c; --brand-ink:#ffffff; --green:#5c9a37; --warn:#b7791f; --bad:#b42318; --ok:#2f7d32;
  --focus:#2563eb; --calc:#fbf3e6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171615; --surface:#22201e; --surface2:#2c2a27; --line:#3b3835; --fg:#f1eeea; --muted:#a59e96;
  --brand:#d0464a; --brand-ink:#ffffff; --green:#7fbf5a; --warn:#e0a54a; --bad:#ef6b5e; --ok:#6fbf73; --focus:#7aa2ff; --calc:#2e2820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171615; --surface:#22201e; --surface2:#2c2a27; --line:#3b3835; --fg:#f1eeea; --muted:#a59e96;
  --brand:#d0464a; --brand-ink:#ffffff; --green:#7fbf5a; --warn:#e0a54a; --bad:#ef6b5e; --ok:#6fbf73; --focus:#7aa2ff; --calc:#2e2820; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .bar{display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px;color:var(--brand);line-height:1;user-select:none}
.logo sup{color:var(--green);font-size:17px;margin-left:1px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:13px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tab .cnt{font-weight:500;opacity:.8;margin-left:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{min-width:44px;padding:0 10px}

main{padding-block:16px 80px;max-width:1200px;margin:0 auto}
h2{font-size:20px;margin:24px 0 10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.hint{color:var(--muted);font-size:14px}
.note{background:var(--surface2);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--muted)}

/* Startseite */
.home-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.list{display:grid;gap:10px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer}
.card .main{flex:1;min-width:0}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.thumb{width:84px;height:60px;border-radius:6px;object-fit:cover;background:var(--surface2);flex:none}
.empty{text-align:center;padding:48px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);margin-top:14px}

/* Formularzeilen */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(150px,230px) 1fr;align-items:center;border-top:1px solid var(--line);min-height:54px}
.row:first-child{border-top:0}
.row .n{color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.row .l{font-weight:600;font-size:15px;padding:8px 8px 8px 0}
.row .l.red{color:var(--brand)}
.row .c{display:flex;flex-wrap:wrap;gap:8px;padding:7px 10px 7px 0;min-width:0}
.row.aus{background:var(--calc)}
.f{display:flex;align-items:center;gap:6px;min-width:0}
.f .u{color:var(--muted);font-size:14px;white-space:nowrap}
.f .pl{color:var(--muted);font-size:13px;white-space:nowrap}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px;min-width:0;max-width:100%}
select{padding-right:28px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.def{color:var(--muted)}
input.w-s{width:90px} input.w-m{width:160px} input.w-l{width:280px} input.w-xl{width:100%}
.f.grow{flex:1 1 260px}
.f.grow input{flex:1}
textarea{width:100%;min-height:140px;resize:vertical;line-height:1.45}
.check{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 4px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.calc{font-weight:700;font-variant-numeric:tabular-nums;min-width:70px;padding:8px 10px;border-radius:8px;background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2)}
.chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.ok{color:var(--ok)}
.chip button{border:0;background:transparent;color:var(--focus);font-weight:600;padding:0;cursor:pointer}

/* Adresssuche */
.geo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.geo .q{display:flex;gap:8px}
.geo .q input{flex:1}
.sugg{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sugg li{padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.sugg li:first-child{border-top:0}
.sugg li:hover,.sugg li:focus{background:var(--surface2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px;margin-top:12px}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact .v{font-weight:600;font-variant-numeric:tabular-nums}

/* Plan & Skizzen */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);z-index:10}
.toolbar .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.tool{min-width:44px;min-height:44px;border-radius:8px;border:1px solid transparent;background:transparent;font-weight:600;cursor:pointer;padding:0 10px}
.tool[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
.canvaswrap{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.canvaswrap canvas{display:block;width:100%;height:auto;touch-action:none}
.textpop{position:absolute;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mapctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:40px;padding:0 12px;font-weight:600;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sk-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.sk-item img{width:100%;aspect-ratio:1.414;object-fit:cover;display:block;background:var(--surface2)}
.sk-item div{padding:8px 10px;font-weight:600;font-size:14px}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.ph .b{padding:8px;display:grid;gap:6px}
.ph .b input,.ph .b select{width:100%}
.ph .a{display:flex;gap:6px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Export */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pages img{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* Bestätigung / Hinweis */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:460px;width:100%}
.modal .box p{margin:0 0 16px}
.modal .box .actions{justify-content:flex-end}

@media (max-width:700px){
  .row{grid-template-columns:34px 1fr}
  .row .c{grid-column:1/-1;padding:0 10px 10px}
  .toolbar{top:calc(env(safe-area-inset-top,0px) + 104px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Status in der Übersicht */
.card.st-erfolgt{border-left:6px solid var(--warn)}
.card.st-geplant{border-left:6px solid var(--line)}
.card.ohneTermin{border-left:6px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.keinTermin{color:var(--bad)}
.card.st-offerte{opacity:.6;border-left:6px solid var(--ok)}
.card.st-auftrag{border-left:6px solid #2f6fb5}
.card.st-abgesagt{opacity:.55;border-left:6px solid var(--bad)}
.card.st-abgesagt .t{text-decoration:line-through}
.stsel{min-height:36px;font-size:14px;max-width:170px}
.lockbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--calc);border-bottom:1px solid var(--line);padding-block:10px}
.locked canvas,.locked .filebtn,.locked .toolbar{pointer-events:none;opacity:.6}
@media (max-width:700px){.card{flex-wrap:wrap}.stsel{max-width:none}}
.canvaswrap.zoomed{overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
.canvaswrap.zoomed canvas{max-width:none}

/* Bearbeitete Felder hellgelb */
:root{--edit:#fff3b0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--edit:#4d4416}}
:root[data-theme="dark"]{--edit:#4d4416}
input.bearb,select.bearb,textarea.bearb{background-color:var(--edit)!important}
label.check.bearb{background:var(--edit);border-radius:8px;padding:0 8px}

/* Register Montage */
.mofotos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mofotos img{width:84px;height:63px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.schemas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.schema{display:flex;flex-direction:column;gap:4px;padding:10px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.schema.sel{border-color:var(--brand)}
.schema input{position:absolute;opacity:0;pointer-events:none}
.schema img{width:100%;aspect-ratio:1.414;object-fit:contain;background:#fff;border-radius:6px}
.schema small{color:var(--muted)}
.schema a{font-size:14px}

/* Förderformulare */
.modal .box.foe{max-width:980px;width:100%;max-height:94vh;overflow:auto}
.foegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 14px;margin:10px 0}
.foegrid .f{display:flex;flex-direction:column;align-items:stretch}
.foegrid input{width:100%}
.foesig{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:8px}
.foesig canvas{display:block;width:100%;height:auto;aspect-ratio:900/260;margin-top:6px;background:#fff;border:2px dashed var(--line);border-radius:var(--r);touch-action:none}

select.tool.grp{max-width:190px}
select.tool.grp.aktiv{outline:3px solid var(--brand);font-weight:700}

/* Übersicht: Tage seit Aufnahme, Materialofferte angefragt */
.card .tage{display:flex;flex-direction:column;align-items:flex-end;min-width:96px;text-align:right;line-height:1.15}
.card .tage b{font-size:22px}
.card .tage small{color:var(--muted);font-size:12px}
.card .tage.mittel b{color:var(--warn)}
.card .tage.alt b{color:var(--bad)}
.card .tage .mat{font-size:12px;font-weight:700;color:#fff;background:#2f6fb5;border-radius:999px;padding:2px 8px;margin-bottom:4px;white-space:nowrap}
.card .tage .mat.muster{background:var(--green)}
.card.matMuster{border-left:6px solid var(--green)}
.card.matAngefragt{border-left:6px solid #2f6fb5;background:color-mix(in srgb,#2f6fb5 6%,var(--surface))}
/* Auslegung im Register Neues System */
.note.auslegung{margin-bottom:12px}
.note.auslegung .ausl{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:4px}
.note.auslegung .ausl span:first-child{min-width:120px;color:var(--muted)}

/* Hydraulik-Prinzipschema */
.modal .box.hsbox{max-width:1280px;width:100%;max-height:95vh;overflow:auto}
.hsgrid{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:16px;align-items:start}
.hsform{display:flex;flex-direction:column;gap:8px}
.hsform .f{display:flex;flex-direction:column;gap:3px}
.hsgr{display:flex;gap:8px;align-items:center;padding-left:6px}
.hsprev canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media (max-width:820px){.hsgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
