<style>
:root{
  --bg:#faf7f4;--surface:#ffffff;--surface2:#f3eee9;--text:#1f1b18;--muted:#6b625b;--line:#e6ddd5;
  --brand:#de1034;--brand-soft:#fde3e7;--brand-ink:#fff;--accent:#f2c230;--accent-soft:#fdf3cf;
  --ok:#2e7d4f;--ok-soft:#e1f1e7;--warn:#a65f00;--warn-soft:#fbecd6;--danger:#b3261e;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161311;--surface:#211c19;--surface2:#2a2420;--text:#f3ede8;--muted:#a89d94;--line:#3a322c;
  --brand:#ff4d63;--brand-soft:#3d1a20;--accent:#f2c230;--accent-soft:#3a3115;
  --ok:#5cc28a;--ok-soft:#1b3326;--warn:#f0a646;--warn-soft:#3a2a14;--danger:#ff7a70;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#161311;--surface:#211c19;--surface2:#2a2420;--text:#f3ede8;--muted:#a89d94;--line:#3a322c;
  --brand:#ff4d63;--brand-soft:#3d1a20;--accent:#f2c230;--accent-soft:#3a3115;
  --ok:#5cc28a;--ok-soft:#1b3326;--warn:#f0a646;--warn-soft:#3a2a14;--danger:#ff7a70;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.install{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);font-size:13px;padding:8px 16px}.install[hidden]{display:none}.install span{flex:1}.install button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer}
.hdr-brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;flex:none;display:block}
.hero-logo{height:76px;width:auto;display:block;margin:0 0 10px}
.hdr-brand b{display:block;font-size:15px}.hdr-brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.role select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 6px;font-size:13px}
.demo{background:var(--accent-soft);color:var(--text);font-size:12px;text-align:center;padding:4px 16px;border-bottom:1px solid var(--line)}
main{max-width:980px;margin:0 auto;padding:16px 16px 100px}
/* Nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand);font-weight:600}
/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.brand{background:var(--brand);color:#fff;border-color:transparent}
.card.brand .muted{color:rgba(255,255,255,.85)}
.card.soft{background:var(--surface2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px}
.tile:hover{border-color:var(--brand)}
.tile .ic{font-size:20px;line-height:1}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card.brand .btn{background:#fff;color:var(--brand);border-color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip.b{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.chip.y{background:var(--accent-soft);border-color:transparent}
.chip.g{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.filter button{flex:none;cursor:pointer}
.filter button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea.input{min-height:90px;resize:vertical}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--muted)}
.av.e{background:var(--accent-soft);color:var(--text)}
.av.c{background:var(--brand-soft);color:var(--brand)}
.li .grow{flex:1;min-width:0}
.concert{background:linear-gradient(135deg,#b10e2a,#de1034);color:#fff;border:0}.concert .btn{background:#fff;color:var(--brand);border-color:#fff}
.cdates{display:flex;flex-direction:column;gap:6px}.cdates div{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.lyr{font-size:17px;line-height:1.6;margin:0}.lyr1{font-weight:600}
.sheet-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto}
.sheet-img{width:100%;height:auto;display:block}
.li .nm{font-weight:600}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .rt{text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 0 10px}
.sec-h h2{margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:700;color:var(--brand);margin:0 0 6px}
.hero{padding:8px 0 14px}
.hero h1{font-size:1.9rem}
/* Timeline */
.tl{position:relative;margin-left:6px}
.tl-part{margin:18px 0 8px;font-weight:800;font-size:.95rem;color:var(--brand)}
.tl-item{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-item .tm{font-variant-numeric:tabular-nums;font-weight:700}
.tl-item.int{opacity:.8}
.tl-item.int .tm::after{content:" ·";color:var(--warn)}
.tl-item .who{font-size:12px;color:var(--muted)}
/* Saal */
.saal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.saal .ttile{padding:8px}
.saal .ttile b{font-size:13.5px}
.ttile.ehren{background:var(--accent-soft)}
.saal-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.saal-sum b{color:var(--text)}
.stage{grid-column:1/-1;background:var(--text);color:var(--bg);border-radius:10px;text-align:center;padding:10px;font-weight:700;letter-spacing:.2em;font-size:12px}
.ttile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.ttile.front{grid-column:1/-1}
.ttile.mine{border-color:var(--brand)}
.ttile.sel{outline:3px solid var(--accent);outline-offset:1px}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.dots i{height:8px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}
.dots i.f{background:var(--ok);border-color:var(--ok)}
.dots i.e{background:var(--accent);border-color:var(--accent)}
.dots i.m{background:var(--brand);border-color:var(--brand)}
.tbl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:2px solid var(--text);border-radius:6px;overflow:hidden;background:var(--surface)}
.tbl .num{font-size:11px;font-weight:700;text-align:center;padding:3px 0;background:var(--surface2);border-right:1px solid var(--line)}
.tbl .seat{height:128px;border-right:1px solid var(--line);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);padding:4px 0;overflow:hidden;position:relative}
.tbl .seat span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:118px}
.tbl .seat.f{background:var(--ok-soft);color:var(--ok)}
.tbl .seat.e{background:var(--accent-soft);color:var(--text)}
.tbl .seat.c span{font-weight:800}
.tbl .seat.me{box-shadow:inset 0 0 0 3px var(--brand)}
.tbl .seat.hl{animation:pulse 1s ease-in-out 3}
.tbl .seat.empty{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface2) 6px,var(--surface2) 12px)}
.tbl .num:nth-child(8n),.tbl .seat:nth-child(8n){border-right:0}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--accent)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
/* Wine */
.wine{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.wine:last-child{border-bottom:0}
.wine .nm{font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.qty b{min-width:18px;text-align:center}
.cart{position:sticky;bottom:70px;background:var(--text);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.cart .btn{background:var(--brand);border-color:var(--brand);color:#fff}
.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
.st-neu{color:var(--brand)}.st-arbeit{color:var(--warn)}.st-serviert{color:var(--ok)}
/* Survey */
.rate{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.stars button.on{background:var(--accent);border-color:var(--accent);color:#1f1b18}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.lock{text-align:center;padding:30px 16px}
.lock .big{font-size:40px}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.ttl{font-weight:700}
/* Placebo-Lautstärkeregler */
.knob-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.knob{width:min(300px,82vw);height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.knob:active{cursor:grabbing}
.knob:focus-visible{filter:drop-shadow(0 0 0 3px var(--accent))}
.knob .track{fill:none;stroke:var(--surface2);stroke-width:16;stroke-linecap:round}
.knob .fill{fill:none;stroke:var(--brand);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .08s}
.knob .tick{stroke:var(--muted);stroke-width:2}
.knob .tick.on{stroke:var(--brand);stroke-width:3}
.knob .lbl{font:700 13px system-ui,sans-serif;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.knob .lbl.max{fill:var(--brand)}
.vol-val{font-size:64px;font-weight:900;line-height:1;margin-top:-6px;font-variant-numeric:tabular-nums;color:var(--brand)}
.vol-msg{font-size:17px;font-weight:700;text-align:center;min-height:48px;margin:8px 0 0;max-width:340px}
.vol-bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin:12px 0}
.vol-bars i{width:10px;border-radius:3px;background:var(--surface2);transition:background .1s}
.vol-bars i.on{background:var(--brand)}
.vol-bars i.hot{background:var(--accent)}
.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(1px,-1px) rotate(.4deg)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px) rotate(-.4deg)}}

/* Saal wie Tischplan 2025: Bühne links, 3 Spalten à 7 Tische (Tisch 1–7, 8–14, 15–21) */
.saal{grid-template-columns:24px repeat(3,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:6px}
.saal .stage{grid-column:1;grid-row:1/span 7;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;padding:0;letter-spacing:.3em;font-size:11px;border-radius:8px}
.saal .ttile{padding:6px 7px;border-width:1.5px;border-radius:10px}
.saal .ttile b{font-size:12.5px}
.saal .ttile .small{font-size:11px}
.saal .dots{gap:2px;margin-top:5px}.saal .dots i{height:6px}
@media(min-width:700px){.saal{grid-template-columns:34px repeat(3,minmax(0,1fr));gap:8px}.saal .ttile{padding:8px 10px}}
/* Gruppenfarben */
:root{--g0b:#dcefe3;--g0f:#2b6a45;--g1b:#dde8f7;--g1f:#2b5a92;--g2b:#f7e5d2;--g2f:#8a4d10;--g3b:#ece0f4;--g3f:#6a3a88;--g4b:#d9f0ef;--g4f:#226b69;--gxb:#efeae5;--gxf:#6b625b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g0b:#1c3326;--g0f:#86d8a6;--g1b:#1c2a3e;--g1f:#93bcf2;--g2b:#3b2a17;--g2f:#f2b472;--g3b:#30223a;--g3f:#d2a6f0;--g4b:#163332;--g4f:#82d9d6;--gxb:#2a2420;--gxf:#a89d94}}
:root[data-theme="dark"]{--g0b:#1c3326;--g0f:#86d8a6;--g1b:#1c2a3e;--g1f:#93bcf2;--g2b:#3b2a17;--g2f:#f2b472;--g3b:#30223a;--g3f:#d2a6f0;--g4b:#163332;--g4f:#82d9d6;--gxb:#2a2420;--gxf:#a89d94}
.tbl .seat.g0{background:var(--g0b);color:var(--g0f)}.tbl .seat.g1{background:var(--g1b);color:var(--g1f)}.tbl .seat.g2{background:var(--g2b);color:var(--g2f)}.tbl .seat.g3{background:var(--g3b);color:var(--g3f)}.tbl .seat.g4{background:var(--g4b);color:var(--g4f)}.tbl .seat.gx{background:var(--gxb);color:var(--gxf)}
.dots i.g0{background:var(--g0f);border-color:var(--g0f)}.dots i.g1{background:var(--g1f);border-color:var(--g1f)}.dots i.g2{background:var(--g2f);border-color:var(--g2f)}.dots i.g3{background:var(--g3f);border-color:var(--g3f)}.dots i.g4{background:var(--g4f);border-color:var(--g4f)}.dots i.gx{background:var(--gxf);border-color:var(--gxf)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.sw.g0{background:var(--g0f)}.sw.g1{background:var(--g1f)}.sw.g2{background:var(--g2f)}.sw.g3{background:var(--g3f)}.sw.g4{background:var(--g4f)}.sw.gx{background:var(--gxf)}
.tbl .seat.dim{opacity:.35}
.tbl .seat.warn{box-shadow:inset 0 0 0 3px #e0a000}.tbl .seat.warn span::before{content:"⚠ "}
.atabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}.atabs .chip{white-space:nowrap}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:.86rem}.tlist .warnt{color:#a86f00;font-weight:600}
.ttile .gn{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;line-height:1.35;margin-top:2px}
.glegend{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.glegend .gl{display:flex;align-items:center;gap:8px;font-size:13px}
.glegend .gl .muted{font-size:12px}
.grp-h{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.form2{display:grid;grid-template-columns:110px 1fr;gap:8px}
select.input{padding:8px 10px}
.okmsg{border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.spons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px}
.sp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:600;font-size:14px}
a.sp{color:inherit;text-decoration:none}a.sp:hover .grow,a.card.link:hover b{color:var(--brand)}
.sp-logo{width:100px;height:46px;flex:none;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.sp-logo img{max-width:92px;max-height:38px;object-fit:contain;display:block}
.sp-logo b{display:none;color:var(--brand);font-size:15px}
.sp-logo.nologo{background:var(--brand-soft);border-color:transparent}.sp-logo.nologo img{display:none}.sp-logo.nologo b{display:block}
.pt-logo{background:#fff;border-radius:8px;padding:8px;margin:-4px -4px 10px;display:flex;align-items:center;justify-content:center;height:72px}
.pt-logo img{max-height:56px;max-width:100%;object-fit:contain}
.sp-go{color:var(--brand);font-weight:700;font-size:13px}
.sp-ic{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.artist{display:flex;gap:14px;align-items:flex-start}
.art-av{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.grp-photo{margin:0 0 12px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}.grp-photo img{width:100%;display:block}.grp-photo figcaption{font-size:12.5px;color:var(--muted);padding:8px 12px}
.art-img{object-fit:cover;width:84px;height:84px;background:#222}
.art-n{font-size:1.05rem}.art-r{color:var(--brand);font-weight:600;font-size:13px}
.grow{flex:1;min-width:0}
</style>
</head>

/* SHA-256 (kompakt, ohne Abhängigkeiten) */
function sha256(str){const K=[],H=[];let n=2;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  for(let c=0;c<64;n++)if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}

  const h=H.slice(),r=(x,y)=>(x>>>y)|(x<<(32-y)),m=new Uint32Array(64);

    for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+m[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}

  return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}

const FB_CATS=["Problem jetzt","Verbesserung","Lob","Allergie / Essen","Sonstiges"];
function feedbackLink(cat,txt,name,tisch){
  let u;try{u=new URL(FEEDBACK.formUrl)}catch(e){return null}
  const map={XNACHRICHT:txt,XNAME:name||"",XTISCH:tisch||""};
  for(const[k,v]of[...u.searchParams]){
    if(k==="id")continue;
    const q=/^".*"$/.test(v),core=q?v.slice(1,-1):v,wrap=x=>q?`"${x}"`:x;   // Forms setzt Werte teils in Anführungszeichen
    if(FB_CATS.includes(core))u.searchParams.set(k,wrap(cat));
    else if(core in map)u.searchParams.set(k,wrap(map[core]));
  }
  return u.toString().replace(/\+/g,"%20");
}

/* Saal: 21 Tische à 16 Plätze (Muster Bautisch) = 336 Plätze für ca. 330 Gäste.
   Platznummern fortlaufend wie im Sitzplan 2025: Tisch n = Plätze 16·(n−1)+1 … 16·n
   (Tisch 4 = 49–64 Gästetisch, Tisch 8 = 113–128, Tisch 15 = 225–240).
   An einem Tisch sitzen oft 2–3 Gruppen; grosse Gruppen belegen mehrere Tische. */
const EHREN_TISCH="4";
const TABLES=Array.from({length:21},(_,k)=>{const n=String(k+1),e=n===EHREN_TISCH;
  return{id:n,name:e?"Tisch 4 · Gästetisch":"Tisch "+n,short:"Tisch "+n,start:16*k+1,front:e}});
const CAP=TABLES.length*16;
const T=id=>TABLES.find(t=>t.id===id);
function seatsOf(t){const top=[],bot=[];for(let i=0;i<8;i++){top.push(t.start+i*2);bot.push(t.start+i*2+1)}return{top,bot,all:[...top,...bot]}}
/* Reihenfolge beim Platzieren: gegenüberliegende Paare von links nach rechts → Gruppen sitzen zusammen */
function seatOrder(t){const s=seatsOf(t),o=[];for(let i=0;i<8;i++)o.push(s.top[i],s.bot[i]);return o}

const logoBox=x=>{const n=x.n;return x.logo?`<span class="sp-logo"><img src="${x.logo}" alt="" loading="lazy"><b>${esc(n[0])}</b></span>`:`<span class="sp-logo"><img src="logos/${slug(n)}.png" data-ext="jpg,svg,webp" alt="" loading="lazy" onerror="logoFb(this)"><b>${esc(n[0])}</b></span>`};

erdiplom in Bern bei Dominik Roggen ab. Sie tritt häufig als Solistin, Kammermusikpartnerin und Liedbegleiterin im In- und Ausland auf und hat mehrere Aufnahmen bei Schweizer Radio SRF eingespielt. Seit 2005 ist sie an der Hochschule der Künste Bern und seit 2014 am Schweizer Opernstudio in Biel als Korrepetitorin angestellt.\nSie spielt an Festivals wie dem Festival der Kulturen (Ungarn, Bern), dem Festival International du Lied Fribourg und dem Festival Allegro Vivo (Wien) und arbeitet mit bedeutenden Musikpersönlichkeiten zusammen. Seit 2015 leitet sie verschiedene Chöre, Ensembles und Formationen in der Schweiz und korrepetiert regelmässig an nationalen und internationalen Gesangskursen sowie in Opernproduktionen. 2021 hatte sie die künstlerische Leitung der «Wiener Blut»-Produktion der Operettenfestspiele Möriken-Wildegg inne."},

. Marianne Kohler-Bouyer und schloss 2010 ihren Bachelor of Arts in Music ab. Ihr Studium setzte sie mit dem Master of Arts in Music Performance an der Hochschule der Künste Bern bei Mireille Delunsch und Thierry Gregoire fort und schloss diesen im Oktober 2012 erfolgreich ab. Zudem war sie 2010–2012 Mitglied des Schweizer Opernstudios in Biel.\nNach ihrem Studium erhielt sie wichtige Impulse von Noëmi Nadelmann und wurde weiterhin sängerisch von Marianne Kohler-Bouyer und Vili Gospodiva betreut.\nSie ist Preisträgerin der Friedl Wald-Stiftung 2010, des Thuner Kulturförderpreises 2011, Halbfinalistin des Concours Suisse Ernst Haefliger 2012, Preisträgerin des Studienpreises des Migros-Kulturprozent 2012/2013, Preisträgerin der Kaminsky Foundation 2016 und Stipendiatin der Richard Wagner Gesellschaft 2023.\nZudem pflegt sie eine rege Konzerttätigkeit."},

ito» verkörperte. In der Saison 24/25 debütierte er ausserdem an der Oper in Bern als Triquet in P. Tschaikowskis «Eugen Onegin» und am Theater Biel Solothurn als Justin in Daniel Andres neuer Oper «Derborence». Ab Beginn der Spielzeit 2026/27 ist Fabian Meinen Mitglied des Internationalen Opernstudios am Luzerner Theater."},

eunte Sprache. Als Mitglied des weltlichen Ordens der Odd Fellows war er in seiner Loge bereits dreimal Obermeister (Präsident) sowie Hauptpatriarch des Kantons Bern."},

ur Erholung nur Jazz. Somit bin ich musikalisch «mehrsprachig» aufgewachsen: in der Welt von Klassik und gutem altem Jazz.\nMeinen Pädagogik-Master habe ich an der Basler Musikhochschule absolviert. Anschliessend war ich beinahe ein Jahrzehnt lang Orchestermusikerin in Ungarn, in meiner Heimatstadt Győr (Raab).\nDas Leben hat mich zurück in die schöne Schweiz geführt, wo ich als «Mutter» unseres Ensembles 2018 das ODEON Streichquartett gegründet habe. Meine grösste Leidenschaft ist es, Veranstaltungen mithilfe professioneller Livemusik in lebhafte, edle und elegante Festlichkeiten zu verzaubern. Stilistisch vielseitig zu sein und alle Wünsche der Kundinnen und Kunden zu erfüllen, ist meine schönste Aufgabe."},

6pJKSIkqeQ+0EAEhxyh1991mHmzneqSSxa7pGvR9siTookpJLCjYyJKSSSYj//2Q==",bio:"Mein Name ist Greta Somlai-Christan und ich bin die Bratschistin unseres Quartetts. Schon als Kind war mein Traum, mit anderen zusammen zu musizieren.\nMein Lehr- und Konzertdiplom absolvierte ich an der Franz-Liszt-Musikakademie in Budapest. Anschliessend habe ich am Conservatoire de musique neuchâtelois weiterstudiert. Ich nahm an zahlreichen Jugendorchesterfestivals teil, unter anderem in Deutschland und in Japan. 2011 wurde ich Mitglied des Ensemble Symphonique Neuchâtel.\nAls wir unser Streichquartett gegründet haben, ist für mich ein Traum in Erfüllung gegangen. Mit unserer stilistischen Vielfalt können wir unser Quartett so präsentieren, wie es kaum zu erwarten ist. Das bereitet mir eine Riesenfreude!"},

gt in Vokalensembles wie Verba Vocalis, Larynx und Mundartig, u. a. in der Gare du Nord Basel und an der Fête des Vignerons. 2019 erhielt er ein Stipendium der Austria Barock Akademie; Meisterkurse bei Brigitte Fassbaender, Tobias Truniger, Sibylla Rubens und Sophie Raynaud ergänzen seinen Werdegang.",link:{u:"https://luigichiaramonte.ch",t:"luigichiaramonte.ch"}},

/* Gruppen an einem Tisch, sortiert nach erstem Platz; Farbe = Position am Tisch */
function groupsAt(tid){const m=new Map();for(const p of S.people){if(p.tisch!==tid||!p.platz)continue;const k=p.gruppe||"_";
  if(!m.has(k))m.set(k,{g:G(p.gruppe),n:0,min:p.platz});const e=m.get(k);e.n++;e.min=Math.min(e.min,p.platz)}
  return[...m.values()].sort((a,b)=>a.min-b.min)}
function colorMap(tid){const m=new Map();let i=0;for(const e of groupsAt(tid))if(e.g)m.set(e.g.id,"g"+(i++%5));return m}

function parsePlan(txt){
  const rows=csvRows(txt);if(!rows.length)return{err:"Leere Datei."};

  let data=rows;if(iT>=0&&iG>=0)data=rows.slice(1);else{iT=0;iG=1}
  const plan={};let n=0,bad=0;
  for(const r of data){const t=String(r[iT]||"").replace(/[^0-9]/g,""),g=String(r[iG]||"").trim();
    if(!T(t)||!g){bad++;continue}const w=words(g);
    (plan[t]=plan[t]||[]).push(w[0]&&w[0].startsWith("gastetisch")?["gastetisch"]:w);n++}
  if(!n)return{err:"Keine gültigen Zeilen (Format: Tisch;Gruppe)."};
  return{plan,n,bad,tables:Object.keys(plan).length};
}

    if(g){if(!m.has(g.id))m.set(g.id,[]);if(!m.get(g.id).includes(tid))m.get(g.id).push(tid)}}
  return m}
/* Sitzplan Vorjahr (CSV Vorname;Name;Tisch;Platz) – wird nur lokal in der Verwaltung geladen */
let PREV=null,PREV_INFO=null;
const nameKey=(v,n)=>words(v+" "+n).sort().join(" ");
function parsePrev(txt){
  const rows=csvRows(txt);if(rows.length<2)return{err:"Keine Daten gefunden."};
  const hd=rows[0].map(h=>h.trim().toLowerCase());
  const iV=hd.indexOf("vorname"),iN=hd.findIndex(h=>h==="name"||h==="nachname"),iT=hd.findIndex(h=>h.startsWith("tisch")),iP=hd.findIndex(h=>h.startsWith("platz"));
  if(iN<0||iP<0)return{err:"Spalten «Name» und «Platz» nötig (dazu «Vorname», «Tisch»)."};
  const m=new Map();let n=0;
  for(const r of rows.slice(1)){const pl=parseInt(r[iP]);if(!pl||pl<1||pl>336)continue;const t=iT>=0&&parseInt(r[iT])?parseInt(r[iT]):Math.ceil(pl/16);
    if(pl<(t-1)*16+1||pl>t*16)continue;m.set(nameKey(iV>=0?r[iV]:"",r[iN]||""),{tisch:String(t),platz:pl});n++}
  if(!n)return{err:"Keine gültigen Plätze gefunden."};
  return{map:m,n};
}
function allocateGroups(plan=null){
  for(const p of S.people){p.tisch=null;p.platz=null}
  const free=new Map(TABLES.map(t=>[t.id,seatOrder(t)]));
  const normal=TABLES.filter(t=>!t.front).map(t=>t.id);
  // 1. Wer letztes Jahr dabei war, erhält wieder seinen Platz (sofern frei)
  let prevPlaced=0;
  if(PREV)for(const p of S.people){const x=PREV.get(nameKey(p.vorname,p.name));if(!x)continue;const q=free.get(x.tisch);const k=q?q.indexOf(x.platz):-1;
    if(k<0)continue;q.splice(k,1);p.tisch=x.tisch;p.platz=x.platz;prevPlaced++}
  S.prevPlaced=prevPlaced;
  const place=(ms,tid)=>{const q=free.get(tid);for(const p of ms){const s=q.shift();if(s==null)break;p.tisch=tid;p.platz=s}};
  const sortM=g=>members(g).filter(p=>!p.platz).sort((a,b)=>(b.id===g.chef)-(a.id===g.chef)||byName(a,b));
  // Tische, an denen die Gruppe schon sitzt, zuerst
  const pref=(g,pool)=>{const own=g?[...new Set(members(g).filter(p=>p.tisch).map(p=>p.tisch))]:[];return[...own.filter(t=>pool.includes(t)),...pool.filter(t=>!own.includes(t))]};
  const done=new Set(),leftovers=[];
  if(plan){const pm=planMatch(plan);
    for(const tid of Object.keys(plan).sort((a,b)=>a-b))for(const[gid,tabs]of pm){if(done.has(gid)||tabs[0]!==tid)continue;
      const g=G(gid),ms=sortM(g),own=[...new Set(members(g).filter(p=>p.tisch).map(p=>p.tisch))];for(const t of pref(g,[...own,...tabs.filter(t=>!own.includes(t))])){if(!ms.length)break;place(ms.splice(0,free.get(t).length),t)}
      if(ms.length)leftovers.push([g,ms]);done.add(gid)}}
  const fit=(ms,pool,g)=>{
    pool=pref(g,pool);
    for(const t of pool){if(!ms.length)break;if(g&&members(g).some(p=>p.tisch===t)){const k=free.get(t).length;if(k)place(ms.splice(0,k),t)}}
    while(ms.length>=16){const t=pool.find(id=>free.get(id).length===16);if(!t)break;place(ms.splice(0,16),t)}
    if(!ms.length)return;
    const c=pool.filter(id=>free.get(id).length>=ms.length).sort((a,b)=>free.get(a).length-free.get(b).length)[0];
    if(c){place(ms.splice(0),c);return}
    for(const id of[...pool].sort((a,b)=>free.get(b).length-free.get(a).length)){if(!ms.length)break;const k=free.get(id).length;if(k)place(ms.splice(0,k),id)}
  };
  for(const g of S.groups.filter(g=>g.guest&&!done.has(g.id)))fit(sortM(g),[EHREN_TISCH,...normal],g);
  // Gruppen ohne Vorlage zuerst an Tische, die in der Vorlage frei sind
  const resv=new Set(plan?Object.keys(plan):[]),open=normal.filter(t=>!resv.has(t));
  for(const g of S.groups.filter(g=>!g.guest&&!done.has(g.id)).sort((a,b)=>members(b).length-members(a).length)){const ms=sortM(g);
    if(open.length&&resv.size&&!members(g).some(p=>p.tisch))fit(ms,open,g);if(ms.length)fit(ms,normal,g)}
  for(const[g,ms]of leftovers.sort((a,b)=>b[1].length-a[1].length))fit(ms,normal,g);
  for(const g of S.groups)if(wishesFor(g).length)arrangeGroup(g);
  return plan?planMatch(plan).size:0;
}
function freeSeats(tid){return seatOrder(T(tid)).filter(s=>!at(tid,s))}
/* Personen ohne Platz auf freie Plätze setzen: zuerst eigener Tisch, dann Tische der Gruppe, dann irgendein Tisch */
function fillSingles(list){
  let n=0;
  for(const p of list){
    if(p.platz)continue;
    const g=G(p.gruppe);
    const pref=[p.tisch,...(g?groupTables(g):[])].filter(Boolean);
    const pool=S.role==="ok"?[...pref,...TABLES.filter(t=>!t.front).map(t=>t.id)]:pref;
    for(const tid of pool){const f=freeSeats(tid);if(f.length){p.tisch=tid;p.platz=f[0];n++;break}}
  }
  return n;
}

/* Gruppe an ihren Tischen neu ordnen: möglichst alle Wünsche erfüllen, möglichst wenige Umplatzierungen */
function arrangeGroup(g){
  if(!g)return{n:0,viol:0,total:0};
  const tabs=groupTables(g);if(!tabs.length)return{n:0,viol:0,total:0,noTable:1};
  const slots=[];for(const tid of tabs){const s=seatsOf(T(tid));for(const n of[...s.top,...s.bot]){const p=at(tid,n);if(!p||p.gruppe===g.id)slots.push({t:tid,n})}}
  const adj=slots.map(a=>slots.map(b=>a.t===b.t&&neighbors(a.t,a.n).includes(b.n)));
  const ms=members(g),seated=ms.filter(p=>p.platz&&tabs.includes(p.tisch)),ppl=[...seated,...ms.filter(p=>!seated.includes(p))].slice(0,slots.length);
  const idx=new Map(ppl.map((p,i)=>[p.id,i])),ws=S.wishes.filter(w=>idx.has(w.a)||idx.has(w.b));
  const asg=new Array(ppl.length).fill(-1),used=new Set();
  ppl.forEach((p,i)=>{if(p.platz){const j=slots.findIndex(s=>s.t===p.tisch&&s.n===p.platz);if(j>=0&&!used.has(j)){asg[i]=j;used.add(j)}}});
  ppl.forEach((p,i)=>{if(asg[i]<0){const j=slots.findIndex((s,k)=>!used.has(k));asg[i]=j;used.add(j)}});
  const orig=asg.slice();
  const fixedAdj=(i,pid)=>{const q=P(pid);if(!q||!q.platz)return false;const s=slots[asg[i]];return s.t===q.tisch&&neighbors(s.t,s.n).includes(q.platz)};
  const isAdj=w=>{const ia=idx.get(w.a),ib=idx.get(w.b);if(ia!=null&&ib!=null)return adj[asg[ia]][asg[ib]];return ia!=null?fixedAdj(ia,w.b):fixedAdj(ib,w.a)};
  const viol=()=>ws.filter(w=>(w.typ==="neben")!==isAdj(w)).length;
  const cost=()=>{let c=viol()*10;for(let i=0;i<asg.length;i++)if(asg[i]!==orig[i])c+=0.3;return c};
  if(ws.length&&ppl.length>1){
    // 1. Einzelne Verschiebungen/Tausche, solange es besser wird (wenig Umplatzierungen)
    const greedy=()=>{let cur=cost(),imp=true;while(imp){imp=false;for(let i=0;i<ppl.length;i++)for(let j=0;j<slots.length;j++){if(asg[i]===j)continue;
      const k=asg.indexOf(j),old=asg[i];if(k>=0)asg[k]=old;asg[i]=j;const c=cost();if(c<cur-1e-9){cur=c;imp=true}else{asg[i]=old;if(k>=0)asg[k]=j}}}};
    greedy();
    // 2. Falls noch Wünsche offen: breitere Suche (Simulated Annealing), danach wieder Feinschliff
    if(viol()>0){let seed=42;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
      let cur=cost(),best=cur,bestA=asg.slice();const N=8000;
      for(let it=0;it<N;it++){const temp=4*(1-it/N)+0.02;
        const i=Math.floor(rnd()*ppl.length),j=Math.floor(rnd()*slots.length);if(asg[i]===j)continue;
        const k=asg.indexOf(j),old=asg[i];if(k>=0){asg[k]=old}asg[i]=j;
        const c=cost();if(c<=cur||rnd()<Math.exp((cur-c)/temp)){cur=c;if(c<best){best=c;bestA=asg.slice()}}
        else{asg[i]=old;if(k>=0)asg[k]=j}}
      asg.splice(0,asg.length,...bestA);greedy()}}
  let n=0;ppl.forEach((p,i)=>{const s=slots[asg[i]];if(p.tisch!==s.t||p.platz!==s.n)n++;p.tisch=s.t;p.platz=s.n});
  return{n,viol:viol(),total:ws.length};
}

/* ================= Import (Webling-CSV oder einfache Liste) ================= */
function csvRows(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split("\n")[0];const d=first.split(";").length>first.split(",").length?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function importCSV(txt){
  const rows=csvRows(txt);if(rows.length<2)return{err:"Keine Datenzeilen gefunden."};
  const hd=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...ns)=>{for(const n of ns){const i=hd.indexOf(n);if(i>=0)return i}return-1};
  const iV=col("vorname"),iN=col("name","nachname"),iG=col("herrenabend-tisch","gruppe","tischgruppe"),iT=col("teilnahme herrenabend","teilnahme"),
        iGs=col("gruppen"),iTyp=col("typ"),iTi=col("tisch"),iPl=col("platz"),iM=col("mitglieder id","mitglieder-id","member_id");
  if(iV<0||iN<0)return{err:"Spalten «Vorname» und «Name» fehlen."};
  const cell=(r,i)=>i>=0?String(r[i]??"").trim():"";
  let data=rows.slice(1).map(r=>({v:cell(r,iV),n:cell(r,iN),g:cell(r,iG),t:cell(r,iT),gs:cell(r,iGs).split(",").map(s=>s.trim()).filter(Boolean),typ:cell(r,iTyp).toLowerCase(),ti:cell(r,iTi),pl:parseInt(cell(r,iPl)),mid:cell(r,iM)})).filter(x=>x.v||x.n);
  let year=null,skipped=0;
  if(iT>=0){const c={};data.forEach(x=>(x.t.match(/\d{4} Ja/g)||[]).forEach(m=>{const y=m.slice(0,4);c[y]=(c[y]||0)+1}));
    year=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
    if(year){const b=data.length;data=data.filter(x=>x.t.includes(year+" Ja"));skipped=b-data.length}}
  const NOG=new Set(["","keinezuteilung","keine","offen","nein"]);const gm=new Map();
  for(const x of data){let k=key(x.g);
    // Gäste (z.B. Musiker, Ehrengäste): «Gäste» oder ohne Tischgruppe, aber Webling-Gruppe «Gästetisch» → Gästetisch
    if(k==="gaste"||k==="herrenabendgaste"||((NOG.has(k))&&x.gs.some(s=>key(s)==="gastetisch"))){k="gastetisch";x.g="Gästetisch"}
    if(k.startsWith("gastetisch")){x.alt=k.slice(10)||null;k="gastetisch";x.g="Gästetisch"}
    if(NOG.has(k)){x.k=null;continue}x.k=k;
    if(!gm.has(k))gm.set(k,{names:{},guest:k==="gastetisch"});const e=gm.get(k);e.names[x.g]=(e.names[x.g]||0)+1}
  let gi=0;const groups=[...gm].map(([k,e])=>({id:"g"+(++gi),key:k,name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0],chef:null,apero:null,guest:e.guest}));
  const tm={"sänger":"aktiv","saenger":"aktiv","aktiv":"aktiv","aktivmitglied":"aktiv","mitglied":"passiv","passiv":"passiv","passivmitglied":"passiv","gast":"sponsor","sponsorgast":"sponsor","ehrengast":"ehrengast"};
  const people=data.map((x,i)=>{const g=groups.find(g=>g.key===x.k);let typ=tm[x.typ];
    if(!typ)typ=/sponsorgast/i.test(x.t)?"sponsor":x.gs.some(s=>/aktive s/i.test(s))?"aktiv":g&&g.guest?"ehrengast":"passiv";
    return{id:"i"+i,mid:x.mid||"",vorname:x.v,name:x.n,typ,gruppe:g?g.id:null,tisch:null,platz:null,token:rndTok(),menu:"normal",_gc:x.gs.some(s=>/gruppenchef/i.test(s)),_alt:x.alt,_ti:x.ti,_pl:x.pl}});
  // Gruppenchefs: Gruppe trägt den Namen der Person → sonst Mitglied mit Gruppe «Gruppenchef»
  // Gästetisch: Tischchef ist der Präsident (ad interim) = Mitglied des Gästetischs mit Gruppe «Gruppenchef»
  for(const g of groups){const ms=people.filter(p=>p.gruppe===g.id);
    g.chef=(g.guest?ms.find(p=>p._gc):(people.find(p=>key(p.vorname+p.name)===g.key)||ms.find(p=>p._gc))||{}).id||null}
  for(const g of groups){const c=people.find(p=>p.id===g.chef);if(g.guest&&c&&c.typ==="ehrengast")c.typ="aktiv"}
  S.people=people;S.groups=groups;
  let fixed=0;for(const p of people){const t=T(p._ti);if(t&&seatsOf(t).all.includes(p._pl)&&!at(t.id,p._pl)){p.tisch=t.id;p.platz=p._pl;fixed++}}
  const planned=fixed?0:allocateGroups(PLAN);
  for(const p of people){delete p._gc;delete p._alt;delete p._ti;delete p._pl}
  S.orders=[];S.proposals=[];S.apero=new Set();S.surveyDone=new Set();S.cart={};S.demo=false;S.selTable=null;S.userId=null;applyGroupAperos();
  const info={n:people.length,year,skipped,planned,groups:groups.length,chefs:groups.filter(g=>g.chef).length,noChef:groups.filter(g=>!g.guest&&!g.chef).map(g=>g.name),
    nog:people.filter(p=>!p.gruppe).length,placed:people.filter(p=>p.platz).length,tables:new Set(people.filter(p=>p.tisch).map(p=>p.tisch)).size,
    mixed:TABLES.filter(t=>groupsAt(t.id).length>1).length};
  S.importInfo=info;return info;
}

function setRole(r){
  if(typeof LIVE!=="undefined"&&LIVE&&S.meObj){S.roleChosen=true;S.cart={};S.orderTable=null;S.meId=S.meObj.id;
    S.role=r==="ok"&&S.isOkUser?"ok":r==="chef"&&isChef(ME())?"chef":"gast";if(r!==S.role)toast("Diese Ansicht ist für dich nicht verfügbar");$("#role").value=S.role;return}
  S.role=r;$("#role").value=r;S.cart={};S.orderTable=null;
  const u=S.userId&&P(S.userId);
  if(r==="ok"){OKUSER.vorname=u?u.vorname:"OK-Team";S.meId="ok";return}
  if(u&&(r==="gast"||isChef(u))){S.meId=u.id;return}
  if(r==="chef"){const g=S.groups.filter(g=>g.chef&&!g.guest).sort((a,b)=>members(b).length-members(a).length)[0];
    if(g){S.meId=g.chef;return}toast("Keine Gruppenchefs vorhanden");S.role="gast";$("#role").value="gast"}
  const mixedT=TABLES.find(t=>!t.front&&groupsAt(t.id).length>1);
  const c=S.people.find(p=>p.tisch===mixedT?.id&&p.platz&&!isChef(p)&&p.gruppe)||S.people.find(p=>p.platz&&!isChef(p)&&p.typ!=="ehrengast")||S.people[0];
  S.meId=c?c.id:"ok";
}

function tableGrid(t,dim=null){
  const me=ME(),s=seatsOf(t),cm=colorMap(t.id),wv=violSet();
  const seat=n=>{const p=at(t.id,n);const cls=["seat"];
    if(!p)cls.push("empty");else{cls.push(gcls(cm,p));if(G(p.gruppe)?.chef===p.id)cls.push("c");if(p.id===me.id)cls.push("me");if(p.id===S.hl)cls.push("hl");if(dim&&p.gruppe!==dim)cls.push("dim");if(wv.has(p.id))cls.push("warn")}
    return`<div class="${cls.join(" ")}" data-act="seat" data-t="${t.id}" data-s="${n}" title="Platz ${n}${p?": "+esc(full(p)):""}"><span>${p?esc(full(p)):""}</span></div>`};
  const gs=groupsAt(t.id);
  return`<div class="tbl">${s.top.map(n=>`<div class="num">${n}</div>`).join("")}${s.top.map(seat).join("")}${s.bot.map(seat).join("")}${s.bot.map(n=>`<div class="num">${n}</div>`).join("")}</div>
    <div class="glegend">${gs.map(e=>`<div class="gl"><span class="sw ${e.g?cm.get(e.g.id):"gx"}"></span><b>${e.g?esc(e.g.name):"ohne Gruppe"}</b><span class="muted">${e.n} Pers.${e.g?.chef?` · Chef ${esc(full(P(e.g.chef)))}`:""}</span></div>`).join("")||`<span class="muted small">Tisch noch frei.</span>`}</div>
    <div class="legend"><span><i style="box-shadow:inset 0 0 0 2px var(--brand)"></i>du</span><span><b>fett</b> = Gruppenchef</span><span><i style="background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 3px,var(--surface2) 3px,var(--surface2) 6px)"></i>frei</span></div>`;
}
function canEditSeat(tid,n){

function openSeat(tid,n){
  const t=T(tid),p=at(tid,n);

function assign(pId,tid,n){
  const c=P(pId),cur=at(tid,n);
  if(cur&&cur!==c){if(c.platz){cur.tisch=c.tisch;cur.platz=c.platz}else cur.platz=null}

}

function vAperoVorab(){
  const key=S.code?APERO_CODES.get(sha256("MCT195A:"+S.code).slice(0,12))||"":"";
  const local=()=>{const ws=key.split(" "),x=GROUP_APEROS.find(a=>a.g.every(w=>ws.includes(w)));return x?{n:x.n,zeit:x.zeit,ort:x.ort}:false};
  if(S.code&&S.myApero===undefined){S.myApero=null;rpc("my_apero",{p_code:S.code,p_key:key}).then(x=>{S.myApero=x||false}).catch(()=>{S.myApero=local()}).finally(()=>{if(/apero/.test(location.hash))render()})}
  const ga=S.myApero;
  return back()+`<h1>Apéro</h1>
    <div class="card brand"><p class="eyebrow" style="color:#fff;opacity:.85">Besammlung für alle</p><h2>${EVENT.apero} Uhr · ${EVENT.aperoOrt}</h2>

      :`<div class="card soft small">Für deine Tischgemeinschaft ist kein eigener Apéro gemeldet – wir sehen uns an der Besammlung für alle.</div>`}`;

/* ===== Placebo-Lautstärkeregler (Joke) ===== */
const VOL_MAX=11,ARC=270,KR=120,KC=2*Math.PI*KR,KARC=KC*ARC/360;
const VOL_MSG=[
  "Stumm. Man hört nur noch das Besteck.",
  "Flüstern – ideal fürs Gastreferat.","Flüstern – ideal fürs Gastreferat.",
  "Angenehmes Tischgespräch.","Angenehmes Tischgespräch.",
  "Männerchor-Normalbetrieb.","Männerchor-Normalbetrieb.",
  "Jodler-Niveau. Die Gläser zittern.","Jodler-Niveau. Die Gläser zittern.",
  "Bechermupf! Steffisburg hört mit.","Bechermupf! Steffisburg hört mit.",
  "Zapfenstreich-Modus. Eins lauter als Maximum."];
S.vol=S.vol??6;S.volFans=37;
function vLaut(){
  const ticks=[...Array(VOL_MAX+1)].map((_,i)=>{const a=(-ARC/2+i*ARC/VOL_MAX)*Math.PI/180,
    x1=150+Math.sin(a)*138,y1=150-Math.cos(a)*138,x2=150+Math.sin(a)*148,y2=150-Math.cos(a)*148,
    lx=150+Math.sin(a)*164,ly=150-Math.cos(a)*164;
    return`<line class="tick" data-i="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="lbl ${i===VOL_MAX?"max":""}" x="${lx}" y="${ly}">${i}</text>`}).join("");
  const ridges=[...Array(36)].map((_,i)=>`<line x1="150" y1="62" x2="150" y2="72" transform="rotate(${i*10} 150 150)" stroke="rgba(255,255,255,.18)" stroke-width="3"/>`).join("");
  return back()+`<h1>Lautstärke Saal</h1><p class="muted">Zu laut? Zu leise? Dreh am Regler – die Technik wird es (vielleicht) merken.</p>
  <div class="card"><div class="knob-wrap">
    <svg class="knob" id="knob" viewBox="-30 -30 360 360" role="slider" tabindex="0" aria-label="Lautstärke" aria-valuemin="0" aria-valuemax="${VOL_MAX}" aria-valuenow="${S.vol}">
      <defs>
        <radialGradient id="kg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#5a524c"/><stop offset=".55" stop-color="#2b2522"/><stop offset="1" stop-color="#141110"/></radialGradient>
        <filter id="ks" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
      </defs>
      <circle class="track" cx="150" cy="150" r="${KR}" stroke-dasharray="${KARC} ${KC}" transform="rotate(135 150 150)"/>
      <circle class="fill" id="kfill" cx="150" cy="150" r="${KR}" stroke-dasharray="0 ${KC}" transform="rotate(135 150 150)"/>
      ${ticks}
      <g filter="url(#ks)"><circle cx="150" cy="150" r="96" fill="url(#kg)"/></g>
      <g id="krot">${ridges}<circle cx="150" cy="150" r="74" fill="#221d1a" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
        <rect x="145" y="80" width="10" height="34" rx="5" fill="var(--brand)"/></g>
      <circle cx="150" cy="150" r="20" fill="#2f2926"/>
    </svg>
    <div class="vol-val" id="vval">${S.vol}</div>
    <div class="vol-bars" id="vbars">${[...Array(VOL_MAX)].map((_,i)=>`<i style="height:${8+i*2.4}px"></i>`).join("")}</div>
    <p class="vol-msg" id="vmsg"></p>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn" data-act="vol" data-d="-1" aria-label="leiser">− Leiser</button>
      <button class="btn primary" data-act="volsend">Wunsch an die Technik</button>
      <button class="btn" data-act="vol" data-d="1" aria-label="lauter">Lauter +</button>
    </div>
  </div></div>
  <p class="small muted" style="text-align:center">🎛️ Placebo-Regler: Deine Einstellung wird mit grösster Sorgfalt ignoriert.<br>Bereits <b id="vfans">${S.volFans}</b> Herren haben heute am Regler gedreht.</p>`;
}
function paintKnob(){
  const v=S.vol,k=$("#knob");if(!k)return;
  $("#krot").setAttribute("transform",`rotate(${-ARC/2+v*ARC/VOL_MAX} 150 150)`);
  $("#kfill").setAttribute("stroke-dasharray",`${KARC*v/VOL_MAX} ${KC}`);
  k.querySelectorAll(".tick").forEach(t=>t.classList.toggle("on",+t.dataset.i<=v));
  k.setAttribute("aria-valuenow",v);
  $("#vval").textContent=v;$("#vmsg").textContent=VOL_MSG[v];
  $("#vbars").querySelectorAll("i").forEach((b,i)=>{b.className=i<v?(i>=8?"hot":"on"):""});
  $("#app").classList.toggle("shake",v===VOL_MAX);
}
function setVol(v){v=Math.max(0,Math.min(VOL_MAX,v));if(v!==S.vol){S.vol=v;navigator.vibrate?.(v===VOL_MAX?[30,30,60]:8);paintKnob()}}
function initKnob(){
  const k=$("#knob");paintKnob();let drag=false;
  const fromEvt=e=>{const r=k.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let a=Math.atan2(e.clientX-cx,cy-e.clientY)*180/Math.PI;a=Math.max(-ARC/2,Math.min(ARC/2,a));
    setVol(Math.round((a+ARC/2)/ARC*VOL_MAX))};
  k.addEventListener("pointerdown",e=>{drag=true;k.setPointerCapture(e.pointerId);fromEvt(e)});
  k.addEventListener("pointermove",e=>{if(drag)fromEvt(e)});
  const end=()=>{if(drag){drag=false;S.volFans++;const f=$("#vfans");if(f)f.textContent=S.volFans}};
  k.addEventListener("pointerup",end);k.addEventListener("pointercancel",end);
  k.addEventListener("keydown",e=>{if(["ArrowUp","ArrowRight"].includes(e.key)){setVol(S.vol+1);e.preventDefault()}if(["ArrowDown","ArrowLeft"].includes(e.key)){setVol(S.vol-1);e.preventDefault()}});
}

function artistList(list){let h="",grp="";for(const a of list){if(a.g!==grp){grp=a.g;h+=`<h3 style="margin:14px 0 8px">${esc(grp)}</h3>`;const gp=GROUP_PHOTOS[grp];if(gp)h+=`<figure class="grp-photo"><img src="${gp.img}" alt="${esc(gp.cap)}" loading="lazy"><figcaption>${esc(gp.cap)}</figcaption></figure>`}h+=artistCard(a)}return h}
function vKuenstler(){
  return back()+`<h1>${SHOW_GUESTS?"Gastreferent & Musik":"Gastmusiker & Solisten"}</h1><p class="muted">Wer am Herrenabend neben dem Männerchor Thun auf der Bühne steht – und die Mitwirkenden unseres Konzerts im November.</p>
  <div class="sec-h"><h2>Am Herrenabend</h2></div>
  ${SHOW_GUESTS?`<h3 style="margin:14px 0 8px">Gastreferat</h3>${artistCard(SPEAKER)}
  <h3 style="margin:14px 0 8px">Intermezzo</h3>${artistCard(INTERMEZZO)}`:""}
  <p class="small muted" style="margin:-4px 0 4px">Luigi Chiaramonte singt als Solist am Herrenabend. Die beiden Tambouren wirken bei der Eröffnung, im Konzert des Männerchors und beim «Zapfenstreich» mit.</p>
  ${artistList(HA_ARTISTS)}
  <div class="sec-h" style="margin-top:28px"><h2>Konzert «${esc(CONCERT.titel)}»</h2></div>
  <div class="card brand"><p class="eyebrow" style="color:#fff;opacity:.85">Männerchor Thun unter der Leitung von Monika Nagy</p>${CONCERT.daten.map(d=>`<h3 style="margin:0 0 4px">${esc(d)}</h3>`).join("")}
  <p class="muted small" style="margin:8px 0 0">${esc(CONCERT.ort)}<br>${esc(CONCERT.info)}</p></div>
  ${artistList(ARTISTS)}
  <p class="small muted">Fotos und weitere Portraittexte werden nach Freigabe durch die Künstlerinnen und Künstler ergänzt.</p>`;
}

function kpi(){const ps=S.people;return{total:ps.length,groups:S.groups.length,noGroup:ps.filter(p=>!p.gruppe).length,noSeat:ps.filter(p=>!p.platz).length,
  noChef:S.groups.filter(g=>!g.guest&&!g.chef).length,sponsor:ps.filter(p=>p.typ==="sponsor").length,ehren:ps.filter(p=>p.typ==="ehrengast").length,
  apero:S.apero.size,vegi:ps.filter(p=>p.menu==="vegi").length,newOrders:S.orders.filter(o=>o.status==="neu").length,urgent:S.feedback.filter(f=>f.cat==="Problem jetzt").length}}
const baseUrl=()=>location.origin.startsWith("http")?location.origin+location.pathname:"https://<user>.github.io/herrenabend/";
const linkOf=p=>baseUrl()+"?t="+p.token;
function feedbackBox(){let h="";
  h+=`<div class="sec-h"><h2>Feedback-Eingang${FEEDBACK.formUrl?"":` (${S.feedback.length})`}</h2>${FEEDBACK.resultsUrl?`<a class="btn sm" href="${esc(FEEDBACK.resultsUrl)}" target="_blank" rel="noopener">Excel öffnen ↗</a>`:""}</div>
    ${FEEDBACK.formUrl?`<p class="small muted">Meldungen kommen über Microsoft Forms in die Excel-Datei im Vorstandsordner; das OK erhält bei jeder Meldung eine Benachrichtigung. Unten nur die Testeinträge der Demo.</p>`:`<p class="small muted">Prototyp: Meldungen bleiben in diesem Browser. Für den Live-Betrieb Microsoft Forms anbinden (siehe Anleitung).</p>`}${S.feedback.slice().reverse().map(f=>`<div class="card small" style="${f.cat==="Problem jetzt"?"border-color:var(--brand)":""}"><div class="row between"><b>${esc(f.cat)}</b><span class="muted">${f.zeit} · ${f.by?esc(full(P(f.by))):"anonym"}</span></div><div style="margin-top:4px">${esc(f.txt)}</div></div>`).join("")}`;
  return h;
}

/* ================= Modal ================= */
function modal(html){const m=$("#modal");m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function closeModal(){$("#modal").hidden=true}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function download(name,txt){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function doImport(txt){
  if(new URLSearchParams(location.search).get("demo")==="1"&&SUPA.url)return modal(`<h2>Das ist die Teilnehmer-Vorschau</h2><p>Hier arbeitet die App mit fiktiven Personen. Ein Import wird <b>nicht gespeichert</b> und ist nach dem Neuladen weg.</p><p>Die echten Teilnehmer importierst du in der <b>OK-Version</b>: Verwaltung → Einstellungen &amp; Import → 2. Teilnehmer importieren.</p><div class="row">${S.code?`<button class="btn primary" data-act="okevent">Zur OK-Version</button>`:""}<button class="btn" data-act="close">Schliessen</button></div>`);const r=importCSV(txt);if(!r||r.err)return toast(r?.err||"Import fehlgeschlagen");setRole("ok");render();toast(`${r.n} Personen in ${r.groups} Gruppen importiert`)}

  opensurvey:()=>{if(S.role!=="ok")return toast("Die Umfrage öffnet nach dem Anlass");call("admin_set_setting",{p_key:"survey_open",p_value:!S.surveyOpen},!S.surveyOpen?"Umfrage freigeschaltet":"Umfrage gesperrt").catch(()=>{})},
  import:()=>doImportLive($("#csvtxt").value),

  setrole:d=>{const id=d.p;if(!id)return toast("Bitte eine Person wählen");call("admin_set_role",{p_person:id,p_role:d.r},d.r==="ok"?"OK-Recht erteilt":"OK-Recht entfernt").catch(()=>{})},
  addperson:()=>{const v=$("#apv").value.trim(),n=$("#apn").value.trim();if(!v||!n)return toast("Bitte Vor- und Nachname angeben");

  wch:d=>{S.wch=d.c;if(d.c==="email"){const o=$("#word"),f=$("#wfb");S.wdef={fb:false,ord:true}}render()},

  eadd:()=>{const n=$("#ename").value.trim(),m=$("#email").value.trim();if(!n||!m)return toast("Bitte Name und E-Mail-Adresse angeben");
    call("admin_save_target",{p_id:null,p_name:n,p_channel:"email",p_to:m,p_apikey:"",p_feedback:$("#wfb").checked,p_order:$("#word").checked,p_active:true},"Empfänger gespeichert – jetzt «Test» drücken").catch(()=>{})},
  tgtoken:()=>{const t=$("#tgtoken").value.trim();if(!t)return toast("Bitte den Token einfügen");
    rpc("admin_set_tg_token",{p_code:S.code,p_token:t}).then(()=>{toast("Bot wird verbunden …");setTimeout(()=>loadLive().then(()=>{render();toast(S.tg&&S.tg.token_error?"Token ungültig":"Bot verbunden")}),3000)}).catch(e=>toast(e.message))},
  tgfetch:()=>rpc("admin_tg_fetch",{p_code:S.code}).then(()=>{toast("Suche Chats …");setTimeout(()=>loadLive().then(()=>{render();if(!(S.tg&&S.tg.chats&&S.tg.chats.length))toast("Noch keine Chats gefunden")}),3500)}).catch(e=>toast(e.message)),
  tgadd:d=>call("admin_save_target",{p_id:null,p_name:d.n,p_channel:"tgbot",p_to:d.id,p_apikey:"",p_feedback:$("#wfb").checked,p_order:$("#word").checked,p_active:true},"Empfänger verbunden – jetzt «Test» drücken").catch(()=>{}),
  wsave:()=>{const ch=S.wch||"telegram",n=$("#wname").value.trim(),ph=$("#wphone").value.trim(),k=$("#wkey")?$("#wkey").value.trim():"";
    if(!n||!ph||(ch==="whatsapp"&&!k))return toast(ch==="telegram"?"Bitte Name und Telegram-Benutzernamen angeben":"Bitte Name, Nummer und API-Key angeben");
    call("admin_save_target",{p_id:null,p_name:n,p_channel:ch,p_to:ph,p_apikey:k,p_feedback:$("#wfb").checked,p_order:$("#word").checked,p_active:true},"Empfänger gespeichert – jetzt «Test» drücken").catch(()=>{})},
  wtest:d=>rpc("admin_test_target",{p_code:S.code,p_id:d.id}).then(()=>{toast("Testnachricht wird gesendet …");
    setTimeout(()=>rpc("admin_send_status",{p_code:S.code}).then(r=>{
      if(r&&r.status==="error"){const m=String(r.message||"");modal(`<h2>Nachricht nicht zugestellt</h2><p class="small">CallMeBot meldet:</p><div class="card soft small">${esc(m)}</div>
        ${/Brevo/i.test(m)?`<p class="small"><b>Lösung:</b> Prüfe in Brevo, ob der Absender bestätigt und der API-Key aktiv ist. Bei «IP address» unter <i>Security → Authorized IPs</i> die IP-Sperre deaktivieren.</p>`:""}${/chat not found|bot was blocked|Forbidden/i.test(m)?`<p class="small"><b>Lösung:</b> Die Person muss den Bot zuerst öffnen und «Starten» tippen bzw. der Bot muss Mitglied der Gruppe sein.</p>`:""}${/authorize|Permission/i.test(m)?`<p class="small"><b>Lösung:</b> Die Person muss CallMeBot einmalig erlauben, ihr zu schreiben. Am einfachsten über diesen Link auf dem Handy: <a href="https://api2.callmebot.com/txt/login.php" target="_blank" rel="noopener">Telegram-Berechtigung erteilen ↗</a> (mit Telegram anmelden und bestätigen). Danach erneut «Test».</p>`:""}
        <div class="row"><button class="btn primary" data-act="close">OK</button></div>`)}
      else toast("✓ Zugestellt – bitte im Handy prüfen")}).catch(()=>{}),4000)}).catch(e=>toast(e.message)),
  wtoggle:d=>{const t=(S.targets||[]).find(x=>x.id===d.id);if(!t)return;call("admin_save_target",{p_id:t.id,p_name:t.name,p_channel:t.channel,p_to:t.phone,p_apikey:"",p_feedback:t.on_feedback,p_order:t.on_order,p_active:!t.active},t.active?"Pausiert":"Aktiviert").catch(()=>{})},

  reload:()=>loadLive().then(()=>{render();toast("Aktualisiert")}).catch(e=>toast(e.message)),
  unlock:()=>{const c=normCode($("#code").value);if(!c)return toast("Bitte den Code eingeben");const vn=cleanName($("#vname")?.value);if(vn)S.vname=vn;S.code=c;
    loadLive().then(()=>{if(APP_MODE==="vorab"&&!S.isOkUser){toast("Die Event-Version öffnet am 5.12.");return setTimeout(leaveEventPreview,1200)}S.unlocked=true;try{const u=new URL(location.href);u.searchParams.set("c",c);if(vn)u.searchParams.set("n",vn);history.replaceState(null,"",u.toString())}catch(e){}render()}).catch(e=>toast(e.message))},

  rpc("send_feedback",{p_code:S.code,p_cat:$("#fbcat").value,p_txt:txt,p_anon:$("#fbanon").checked}).then(()=>{S.feedback.push({id:uid(),cat:$("#fbcat").value,txt,by:S.meId,zeit:now()});render();toast("Danke! Das OK hat dein Feedback erhalten.")}).catch(e=>toast(e.message))}}

/* ================= OK-Zugang aus der Vorabversion / Event-Vorschau ================= */
function checkOk(){if(!S.code)return;rpc("app_session",{p_code:S.code}).then(s=>{if(s&&!s.error&&s.me&&s.me.role==="ok"){S.vorabOk=true;render()}}).catch(()=>{})}
function gotoMode(m,demo){try{const u=new URL(location.href);if(m)u.searchParams.set("modus",m);else u.searchParams.delete("modus");if(demo)u.searchParams.set("demo","1");else u.searchParams.delete("demo");if(S.code)u.searchParams.set("c",S.code);if(S.vname)u.searchParams.set("n",S.vname);u.hash="#/start";location.href=u.toString()}catch(e){}}
function leaveEventPreview(){gotoMode(null)}
A.okevent=()=>gotoMode("event");
A.demoview=()=>gotoMode("event",true);
A.govorab=()=>gotoMode(null);

/* ================= Vollbild ================= */
(function fullscreen(){
  const standalone=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;
  const mobile=matchMedia("(pointer: coarse)").matches;
  if(standalone||!mobile)return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const bar=$("#install"),txt=$("#installTxt"),btn=$("#installBtn");
  $("#installX").onclick=()=>{bar.hidden=true};
  // Android/Chrome: beim ersten Antippen in den Vollbildmodus wechseln (Browser erlauben das nur nach einer Berührung)
  const root=document.documentElement;
  if(root.requestFullscreen&&!ios){
    const go=()=>{if(!document.fullscreenElement)root.requestFullscreen({navigationUI:"hide"}).catch(()=>{})};
    document.addEventListener("click",go,{capture:true});
  }
  // Installation anbieten → App startet danach immer im Vollbild
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;txt.textContent="Als App installieren – startet immer im Vollbild.";btn.hidden=false;bar.hidden=false});
  btn.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;bar.hidden=true};
  if(ios){txt.innerHTML="Für Vollbild: <b>Teilen</b> ⬆︎ → <b>«Zum Home-Bildschirm»</b>, dann die App dort öffnen.";bar.hidden=false}
})();

/* ================= Start ================= */
(function init(){
  seedDemo();
  if(VORAB){document.querySelector(".role").style.display="none"}
  const qc=normCode(new URLSearchParams(location.search).get("c"));
  S.vname=cleanName(new URLSearchParams(location.search).get("n"));
  S.unlocked=!ACCESS.required||(qc&&ACCESS.hashes.has(sha256(ACCESS.salt+qc).slice(0,16)));
  if(VORAB){S.meId="guest";S.role="gast";S.userId=null;if(S.unlocked&&qc)S.code=qc;render();if(S.code)checkOk();return}
  if(LIVE){document.querySelector(".role").style.display="none";S.unlocked=false;S.code=qc;
    if(qc){$("#app").innerHTML=`<p class="muted" style="text-align:center;margin-top:48px">Lade deine Daten …</p>`;
      loadLive().then(()=>{if(APP_MODE==="vorab"&&!S.isOkUser)return leaveEventPreview();S.unlocked=true;render()}).catch(e=>{render();toast(e.message)})}else render();
    return}
  if(S.unlocked&&qc)S.code=qc;
  const tk=new URLSearchParams(location.search).get("t");
  const p=tk&&S.people.find(x=>x.token===tk);
  if(p){S.userId=p.real?p.id:null;S.meId=p.id;S.role=isChef(p)?"chef":"gast";$("#role").value=S.role}else setRole("gast");
  render();
  if(!p&&S.demo&&S.unlocked)askUser();
})();
</script>
